name: CI Quality Gate & Invariant Certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  certify:
    name: Verify Invariants & Test Suites
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --editable ".[test,lint]"

      - name: Execute Full Test Suite & Coverage Floor
        run: |
          pytest tests/ -v --cov=src/atp --cov-report=term-missing --cov-fail-under=90

      - name: Lint (correctness, modernization, import order)
        run: |
          ruff check .

      - name: Code Formatting Verification
        run: |
          ruff format --check .

      - name: Verify Architectural Invariants (Strict M<=6, Depth<=3, Egress)
        run: |
          python tools/sentinel.py src/ tools/ tests/ --preset strict

  rust-verify:
    name: Verify Rust Crate, Clippy & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Code Formatting Verification
        run: cargo fmt --check

      - name: Clippy Linter (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Cargo Test Suite
        run: cargo test --all
