[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acp"
version = "0.1.0a1"
description = "Agentic Communication Protocol (ACP): Specification, Schemas, and Reference Engine for Cognitive State Migration, Attenuated Delegation, and Epistemic Synchronization"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.15.2,<3.16"
authors = [
    { name = "Dan Petty", email = "dan@example.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.7.0",
    "jsonschema>=4.26.0",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
]
lint = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[project.scripts]
acp = "acp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acp"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = [
    "E4",   # import placement and shadowing
    "E7",   # statement-level mistakes
    "E9",   # syntax and IO errors
    "F",    # pyflakes: undefined names, unused imports and variables
    "I",    # import ordering
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplifiable constructs
    "RUF",  # ruff's own correctness rules
]
ignore = [
    "RUF002",  # ambiguous unicode in docstrings
    "RUF003",  # ambiguous unicode in comments
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.sentinel]
preset = "strict"
max_complexity = 6
max_depth = 3
