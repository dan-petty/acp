[package]
name = "acp"
version = "0.1.0-alpha.1"
edition = "2021"
authors = ["Dan Petty <dan@example.com>"]
description = "Agentic Communication Protocol (ACP) Rust Reference Implementation"
license = "Apache-2.0"
readme = "../../README.md"
repository = "https://github.com/dan-petty/acp"

[lib]
name = "acp"
path = "src/lib.rs"

[[bin]]
name = "acp"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.10", features = ["serde", "v4"] }
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.12.2"
clap = { version = "4.6.10", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["fast", "std", "rand_core"] }
rand = "0.8.8"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3.12"
