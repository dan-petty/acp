[package]
name = "atp"
version = "0.1.0-alpha.1"
edition = "2021"
authors = ["Dan Petty <dan@example.com>"]
description = "Agentic Transfer Protocol (ATP) Rust Reference Implementation"
license = "Apache-2.0"
readme = "../../README.md"
repository = "https://github.com/dan-petty/atp"

[lib]
name = "atp"
path = "src/lib.rs"

[[bin]]
name = "atp"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["serde", "v4"] }
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.7"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.12"
